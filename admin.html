<script>
const app = $("#app");
// auth = kunci admin (semua tagihan) atau token sesi host (tagihan sendiri)
let isAdmin = !!store.get("sb_master");
let master = store.get("sb_master") || store.get("sb_token");
let me = null;
const qs = new URLSearchParams(location.search);
const code = (qs.get("b") || "").toUpperCase();
const isNew = qs.has("new");
let bill = null, editing = false, tab = "rekap", lastJson = "";
let pickAv = store.get("sb_avatar") || AVATAR_KEYS[Math.floor(Math.random() * AVATAR_KEYS.length)];

soundButton($("#snd")); bgCoins(6);
app.innerHTML = `<div class="loader"><span class="av">${av("robo")}</span><p>MEMUAT<span class="blink">...</span></p></div>`;
$("#out").onclick = () => { store.del("sb_master"); store.del("sb_token"); location.href = "admin.html"; };

async function start() {
  if (!master) return renderLogin();
  try {
    if (isAdmin) { if (!(await rpc("sb_admin_check", { p_master: master }))) throw 0; }
    else { me = await rpc("sb_whoami", { p_token: master }); if (!me) throw 0; }
  } catch {
    store.del(isAdmin ? "sb_master" : "sb_token"); master = null; isAdmin = false; return renderLogin();
  }
  $("#out").classList.remove("hide");
  $(".brand").innerHTML = isAdmin ? `<span class="logo">%</span> ADMIN` : `<span class="av" style="width:30px;height:30px">${av(me.avatar)}</span> ${esc(me.name.toUpperCase().slice(0, 14))}`;
  if (isNew) return renderNew();
  if (code) { await loadBill(); setInterval(() => { if (!editing && document.visibilityState === "visible") loadBill(true); }, 6000); return; }
  renderList();
}

function renderLogin(adminMode) {
  if (adminMode) {
    app.innerHTML = `<div class="card title-card"><h1>ADMIN</h1><p class="sub" style="margin-top:0">Kunci admin bisa melihat semua tagihan.</p>
      <label style="text-align:left">KUNCI ADMIN</label><input id="k" type="password" autocomplete="current-password">
      <button class="block gold" id="go" style="margin-top:14px">▶ MASUK</button>
      <p class="small" style="margin-bottom:0"><button class="link" id="back">Kembali ke login biasa</button></p></div>`;
    $("#back").onclick = () => renderLogin();
    $("#go").onclick = async () => {
      const k = $("#k").value.trim();
      try {
        if (await rpc("sb_admin_check", { p_master: k })) { store.set("sb_master", k); master = k; isAdmin = true; SFX.start(); start(); }
        else toast("Kunci admin salah", true);
      } catch (e) { toast(e.message, true); }
    };
    return;
  }
  app.innerHTML = `<div class="card title-card"><div class="party">${AVATAR_KEYS.map(k => `<span class="av bob">${av(k)}</span>`).join("")}</div>
    <h1>JADI HOST</h1><p class="sub" style="margin-top:0">Masuk untuk membuat tagihan dan menagih teman. Pakai nomor dan PIN yang sama kalau sudah pernah main.</p></div>
    <div class="card"><span class="label">PILIH KARAKTER</span><div style="height:12px"></div>
    <div class="chars">${AVATAR_KEYS.map(k => `<div class="char ${k === pickAv ? "on" : ""}" data-av="${k}"><span class="av">${av(k)}</span><div class="nm">${esc(AVATARS[k].name.split(" ")[0])}</div></div>`).join("")}</div>
    <div class="charname" id="cname">${esc(AVATARS[pickAv].name.toUpperCase())}</div></div>
    <div class="card"><span class="label">DATA HOST</span>
    <label>NAMA</label><input id="nm" maxlength="40" autocomplete="name" value="${esc(store.get("sb_name") || "")}">
    <label>NOMOR HP (WA)</label><input id="ph" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" value="${esc(store.get("sb_phone") || "")}">
    <label>PIN RAHASIA (4 ANGKA)</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="····">
    <button class="block gold" id="go" style="margin-top:16px">▶ MASUK</button>
    <p class="small" style="margin-bottom:0;text-align:center"><button class="link" id="adm">Masuk dengan kunci admin</button></p></div>`;
  app.querySelectorAll(".char").forEach(el => el.onclick = () => {
    pickAv = el.dataset.av; SFX.select();
    app.querySelectorAll(".char").forEach(c => c.classList.toggle("on", c === el));
    $("#cname").textContent = AVATARS[pickAv].name.toUpperCase();
  });
  $("#pin").addEventListener("input", (e) => (e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4)));
  $("#adm").onclick = () => renderLogin(true);
  $("#go").onclick = async (e) => {
    const nm = $("#nm").value.trim(), ph = $("#ph").value.trim(), pin = $("#pin").value;
    if (!nm) return toast("Isi nama dulu", true);
    if (pin.length !== 4) return toast("PIN harus 4 angka", true);
    e.target.disabled = true;
    try {
      const r = await rpc("sb_login", { p_name: nm, p_phone: ph, p_pin: pin, p_avatar: pickAv });
      store.set("sb_token", r.token); store.set("sb_name", nm); store.set("sb_phone", ph); store.set("sb_avatar", pickAv);
      master = r.token; isAdmin = false; SFX.start(); start();
    } catch (err) { toast(err.message, true); e.target.disabled = false; }
  };
}

async function renderList() {
  let list = [];
  try { list = await rpc("sb_admin_list", { p_master: master }); } catch (e) { return toast(e.message, true); }
  let h = `<h1>${isAdmin ? "SEMUA TAGIHAN" : "TAGIHANKU"}</h1><p class="sub">Foto struknya, cek hasil bacaannya, lalu bagikan link ke teman.</p>
    <a class="btn block gold" href="admin.html?new" style="margin-top:14px">📸 TAGIHAN BARU</a>`;
  if (!list.length) h += `<div class="card muted">Belum ada tagihan. Tekan tombol di atas untuk mulai.</div>`;
  for (const b of list) {
    const done = b.members > 0 && b.lunas >= b.members;
    h += `<a class="card billrow" href="admin.html?b=${b.code}"><div class="row between">
      <div class="grow"><div class="strong">${esc(b.title)}</div><div class="small muted">${esc([b.place, fmtDate(b.bill_date), isAdmin && b.host ? "host " + b.host : ""].filter(Boolean).join(" · "))}</div></div>
      <div style="text-align:right"><div class="px num" style="font-size:10px">${rp(b.total)}</div>
      <div class="small" style="margin-top:6px">${b.locked ? '<span class="tag">🔒</span> ' : ""}<span class="tag ${done ? "ok" : "wait"}">${b.lunas}/${b.members} LUNAS${done ? " ★" : ""}</span></div></div></div></a>`;
  }
  app.innerHTML = h;
}

// --------------------------------------------------------------- buat baru
let rows = [];

function parseItems(txt) {
  const out = [];
  txt.split(/\n/).map(s => s.trim()).filter(Boolean).forEach((line) => {
    let qty = 1, name, price, m;
    const parts = line.split("|").map(s => s.trim());
    if (parts.length === 3) [qty, name, price] = parts;
    else if (parts.length === 2) [name, price] = parts;
    else if ((m = line.match(/^(\d+)\s*x\s+(.+?)\s+(?:rp\.?\s*)?([\d.,]+)$/i))) [, qty, name, price] = m;
    else if ((m = line.match(/^(.+?)\s+(?:rp\.?\s*)?([\d.,]+)$/i))) [, name, price] = m;
    qty = parseInt(String(qty).replace(/\D/g, "")) || 1;
    price = parseInt(String(price ?? "").replace(/\D/g, ""));
    if (name && !isNaN(price)) out.push({ qty, name, price });
  });
  return out;
}

// perkecil foto di HP sebelum dikirim (lebih cepat dan hemat kuota)
function shrinkImage(file, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const d = c.toDataURL("image/jpeg", 0.85); resolve({ data: d.split(",")[1], preview: d });
    };
    img.onerror = () => reject(new Error("Foto tidak bisa dibuka. Coba format JPG atau PNG."));
    img.src = url;
  });
}

async function scanReceipt(file) {
  const box = $("#scanbox");
  box.innerHTML = `<div class="loader" style="padding:24px 0"><span class="av">${av("robo")}</span><p>MEMBACA STRUK<span class="blink">...</span></p></div>`;
  try {
    const img = await shrinkImage(file);
    box.innerHTML = `<div class="row" style="align-items:center"><img src="${img.preview}" style="width:72px;height:96px;object-fit:cover;border:var(--b);border-radius:8px">
      <div class="grow"><div class="loader" style="padding:0;text-align:left"><span class="av" style="width:40px;height:40px">${av("robo")}</span><p style="margin-top:8px">MEMBACA STRUK<span class="blink">...</span></p></div></div></div>`;
    const r = await fetch(`${SB_URL}/functions/v1/scan-struk`, {
      method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ token: master, image: img.data, mime: "image/jpeg" }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || "Gagal membaca struk");
    rows = d.items.map(i => ({ ...i }));
    if (d.total) $("#total").value = fmtNum(Math.round(d.total));
    if (d.place) { $("#place").value = d.place; if (!$("#title").value) $("#title").value = "Makan di " + d.place; }
    if (/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) $("#date").value = d.date;
    drawRows();
    const sub = rows.reduce((a, i) => a + i.qty * i.price, 0);
    const warn = d.subtotal && Math.abs(d.subtotal - sub) > 1 ? `<br>⚠️ Subtotal di struk ${rp(d.subtotal)}, hasil bacaan ${rp(sub)}. Cek lagi item yang terlewat atau salah harga.` : "";
    box.innerHTML = `<div class="notice ok" style="margin-top:0"><span>🤖</span><div><b>${rows.length} ITEM TERBACA!</b>Cek lagi nama, jumlah, dan harganya. AI kadang salah baca.${d.notes ? "<br>Catatan: " + esc(d.notes) : ""}${warn}</div></div>
      <button class="sm ghost" id="rescan" style="margin-top:10px">📸 FOTO ULANG</button>`;
    $("#rescan").onclick = () => $("#file").click();
    SFX.ok(); confetti(30);
  } catch (e) {
    box.innerHTML = `<div class="notice"><span>⚠️</span><div><b>GAGAL MEMBACA</b>${esc(e.message)}</div></div><button class="sm ghost" id="rescan" style="margin-top:10px">📸 COBA LAGI</button>`;
    $("#rescan").onclick = () => $("#file").click(); SFX.bad();
  }
}

function drawRows() {
  const el = $("#rows");
  el.innerHTML = rows.map((r, i) => `<div class="row ed" style="gap:6px;margin-top:8px" data-i="${i}">
      <input data-f="qty" inputmode="numeric" value="${r.qty}" style="width:48px;text-align:center">
      <input data-f="name" value="${esc(r.name)}" placeholder="Nama item" class="grow">
      <span class="money sm" style="width:112px;flex:none"><input data-f="price" inputmode="numeric" value="${fmtNum(r.price)}" placeholder="Harga" style="text-align:right"></span>
      <button class="sm danger" data-del="${i}" aria-label="Hapus item">✕</button></div>`).join("") ||
    `<p class="small muted" style="margin:6px 0 0">Belum ada item. Scan struk atau tambah manual.</p>`;
  el.querySelectorAll("input").forEach(inp => inp.oninput = () => {
    const i = +inp.closest("[data-i]").dataset.i, f = inp.dataset.f;
    if (f === "price") inp.value = fmtNum(inp.value);
    rows[i][f] = f === "name" ? inp.value : numOf(inp.value) || 0;
    updTotals();
  });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); drawRows(); });
  updTotals();
}

function updTotals() {
  const sub = rows.reduce((a, i) => a + (i.qty || 1) * (i.price || 0), 0);
  const tot = parseInt($("#total").value.replace(/\D/g, ""));
  let h = rows.length ? `Subtotal item: <b>${rp(sub)}</b>` : "";
  if (sub && tot) {
    const d = tot - sub;
    h += d === 0 ? " · tanpa pajak atau service." :
      `<br>${d > 0 ? "Pajak & service" : "Diskon"}: <b>${rp(Math.abs(d))}</b> (${(Math.abs(d) / sub * 100).toFixed(1).replace(".", ",")}% dari subtotal), dibagi sebanding ke tiap orang.`;
  }
  $("#adj").innerHTML = h;
}

async function renderNew() {
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const pn = isAdmin ? store.get("sb_payer_name") || "" : me.name;
  const pp = isAdmin ? store.get("sb_payer_phone") || "" : "0" + String(me.phone).replace(/^62/, "");
  rows = [];
  app.innerHTML = `<h1>TAGIHAN BARU</h1>
  <div class="card"><span class="label gold">FOTO STRUK</span>
    <p class="small muted" style="margin-top:8px">Foto struknya, AI akan membaca item dan totalnya. Pastikan struk lurus, terang, dan terlihat utuh.</p>
    <input type="file" id="file" accept="image/*" class="hide">
    <div id="scanbox"><button class="block gold" id="pick">📸 FOTO / PILIH STRUK</button></div>
  </div>
  <div class="card"><span class="label">DAFTAR ITEM</span>
    <div class="row small muted" style="gap:6px;margin-top:10px;font-family:var(--px);font-size:7px"><span style="width:48px;text-align:center">QTY</span><span class="grow">NAMA</span><span style="width:112px;text-align:right">HARGA SATUAN</span><span style="width:30px"></span></div>
    <div id="rows"></div>
    <div class="row" style="gap:8px;margin-top:12px"><button class="sm soft" id="addRow">+ TAMBAH ITEM</button><button class="sm ghost" id="pasteBtn">TEMPEL TEKS</button></div>
    <div id="pasteBox" class="hide"><textarea id="items" style="margin-top:10px" placeholder="2 | Nasi Goreng | 25000&#10;3 | Es Teh | 5000"></textarea>
      <button class="sm" id="pasteGo" style="margin-top:8px">MASUKKAN</button></div>
    <label>TOTAL AKHIR STRUK</label><div class="small muted" style="margin:-4px 0 8px">Sudah termasuk pajak, service, dan diskon.</div>
    <div class="money"><input id="total" inputmode="numeric" placeholder="Contoh 167.475"></div>
    <div id="adj" class="small muted" style="margin-top:8px"></div>
  </div>
  <div class="card"><span class="label">INFO TAGIHAN</span>
    <label>JUDUL</label><input id="title" placeholder="Makan malam">
    <div class="row"><div class="grow"><label>TEMPAT</label><input id="place"></div>
    <div class="grow"><label>TANGGAL</label><input id="date" type="date" value="${today}"></div></div>
  </div>
  <div class="card"><span class="label">PENALANG</span>
    <p class="small muted" style="margin-top:8px">Orang yang membayar ke kasir. Teman akan transfer ke sini.</p>
    <label>NAMA</label><input id="pn" value="${esc(pn)}">
    <label>NOMOR HP</label><input id="pp" inputmode="tel" value="${esc(pp)}">
    <label>INFO TRANSFER</label><textarea id="pi" style="min-height:80px" placeholder="BCA 1234567890 a.n. Nama&#10;DANA 08xxxx">${esc(store.get("sb_payer_info") || "")}</textarea>
  </div>
  <button class="block gold" id="create" style="margin-top:20px">▶ BUAT TAGIHAN</button>`;
  drawRows();
  $("#pick").onclick = () => $("#file").click();
  $("#file").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) scanReceipt(f); };
  moneyInput($("#total"), updTotals);
  $("#addRow").onclick = () => { rows.push({ qty: 1, name: "", price: 0 }); drawRows(); const ins = $("#rows").querySelectorAll('[data-f="name"]'); ins[ins.length - 1].focus(); };
  $("#pasteBtn").onclick = () => $("#pasteBox").classList.toggle("hide");
  $("#pasteGo").onclick = () => { const p = parseItems($("#items").value); if (!p.length) return toast("Teks belum terbaca", true); rows.push(...p); $("#items").value = ""; $("#pasteBox").classList.add("hide"); drawRows(); };
  $("#create").onclick = async (e) => {
    const items = rows.filter(r => r.name.trim()).map(r => ({ qty: r.qty || 1, name: r.name.trim(), price: r.price || 0 }));
    const tot = parseInt($("#total").value.replace(/\D/g, ""));
    if (!items.length) return toast("Daftar item masih kosong", true);
    if (items.some(i => !i.price)) return toast("Ada item yang harganya belum diisi", true);
    if (isNaN(tot)) return toast("Isi total akhir struk", true);
    if (isAdmin) { store.set("sb_payer_name", $("#pn").value.trim()); store.set("sb_payer_phone", $("#pp").value.trim()); }
    store.set("sb_payer_info", $("#pi").value.trim());
    e.target.disabled = true; e.target.textContent = "MEMBUAT...";
    try {
      const b = await rpc("sb_admin_create_bill", { p_master: master, p_title: $("#title").value, p_place: $("#place").value,
        p_date: $("#date").value || null, p_total: tot, p_items: items,
        p_payer_name: $("#pn").value, p_payer_phone: $("#pp").value, p_payment_info: $("#pi").value });
      SFX.ok(); store.set("sb_fresh", b.code); location.href = "admin.html?b=" + b.code;
    } catch (err) { toast(err.message, true); e.target.disabled = false; e.target.textContent = "▶ BUAT TAGIHAN"; }
  };
}

// --------------------------------------------------------------- detail
async function loadBill(silent) {
  try {
    const b = await rpc("sb_admin_get", { p_master: master, p_code: code });
    const j = JSON.stringify(b);
    if (silent && j === lastJson) return;
    lastJson = j; bill = b;
    if (!editing) renderBill();
    if (!silent && store.get("sb_fresh") === code) { store.del("sb_fresh"); confetti(50); stamp("LEVEL<br>DIBUAT!"); }
  } catch (e) { if (!silent) app.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

function waText(m) {
  const br = personBreakdown(bill, m.id);
  const adjLabel = bill.adjust > 0 ? "Pajak & service" : "Diskon";
  let t = `Halo ${m.name}, ini rincian bagianmu untuk *${bill.title}*${bill.bill_date ? " (" + fmtDate(bill.bill_date) + ")" : ""}:\n\n`;
  t += br.lines.map(l => `• ${l.name}${l.n > 1 ? " (dibagi " + l.n + ")" : ""}: ${rp(l.part)}`).join("\n");
  t += `\n\nSubtotal: ${rp(br.sub)}`;
  if (Math.round(br.adj)) t += `\n${adjLabel}: ${rp(Math.abs(br.adj))}`;
  t += `\n*Total: ${rp(br.owe)}*`;
  if (bill.payment_info) t += `\n\nTransfer ke:\n${bill.payment_info}`;
  t += `\n\nRincian lengkap dan tombol konfirmasi transfer:\n${billLink(bill.code)}\n\nTerima kasih!`;
  return t;
}

function groupText() {
  return `Halo semua! Tagihan *${bill.title}* sudah bisa dibagi.\n\n1. Buka link ini\n2. Masuk pakai nama, nomor HP, dan PIN 4 angka\n3. Centang pesanan masing-masing (yang patungan centang juga)\n\nTotal per orang langsung terhitung, termasuk pajak dan service.\n${billLink(bill.code)}`;
}

function recapText() {
  let t = `*Rekap ${bill.title}*\nTotal struk: ${rp(bill.total)}\n\n`;
  t += bill.members.map(m => `${m.is_payer ? "💳" : m.status === "lunas" ? "✅" : m.status === "sudah_transfer" ? "🕒" : "⬜"} ${m.name}: ${rp(m.owe)}${m.is_payer ? " (penalang)" : ""}`).join("\n");
  if (bill.unclaimed > 0) t += `\n\n⚠️ Belum diklaim: ${rp(bill.unclaimed_owe)}`;
  return t + `\n\n${billLink(bill.code)}`;
}

function statusSel(m) {
  if (m.is_payer) return '<span class="tag pay">PENALANG</span>';
  return `<select data-st="${m.id}" style="padding:6px 8px;font-size:13px;width:auto">
    ${[["belum", "Belum bayar"], ["sudah_transfer", "Sudah transfer"], ["lunas", "Lunas"]].map(([v, l]) => `<option value="${v}" ${m.status === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}

function renderBill() {
  const y = window.scrollY;
  const claimedOwe = bill.members.reduce((a, m) => a + m.owe, 0);
  const lunas = bill.members.filter(m => m.status === "lunas" || m.is_payer).length;
  let h = `<h1>${esc(bill.title)}</h1><div class="sub">${esc([bill.place, fmtDate(bill.bill_date)].filter(Boolean).join(" · "))} · Kode <b class="px" style="font-size:11px">${bill.code}</b></div>
  <div class="card"><span class="label gold">LINK UNTUK PARTY</span>
    <div class="strong" style="word-break:break-all;margin:8px 0 12px">${esc(billLink(bill.code))}</div>
    <div class="row"><button class="soft grow" id="cpLink">SALIN LINK</button>
    <a class="btn wa grow" target="_blank" href="https://wa.me/?text=${encodeURIComponent(groupText())}">KIRIM KE WA</a></div>
    ${!isAdmin ? `<a class="btn block gold" href="./?b=${bill.code}" style="margin-top:10px">🍽️ PILIH PESANANKU</a>` : ""}</div>
  <div class="row" style="margin-top:14px;gap:8px">
    <div class="stat gold"><div class="k">STRUK</div><div class="v num">${rp(bill.total)}</div></div>
    <div class="stat"><div class="k">TERKLAIM</div><div class="v num">${rp(claimedOwe)}</div></div>
    <div class="stat"><div class="k">LUNAS</div><div class="v">${lunas}/${bill.members.length}</div></div></div>
  <div class="hpbar"><i style="width:${bill.total > 0 ? Math.min(100, Math.round(claimedOwe / bill.total * 100)) : 0}%"></i></div>`;
  if (bill.unclaimed > 0) h += `<div class="notice"><span>⚠️</span><div><b>ITEM TERSISA</b>Senilai ${rp(bill.unclaimed)} (${rp(bill.unclaimed_owe)} setelah pajak) belum diklaim siapa pun.</div></div>`;
  else if (bill.items.length) h += `<div class="notice ok"><span>🏆</span><div><b>SEMUA ITEM DIKLAIM!</b>Tagihan semua pemain pas dengan total struk.</div></div>`;
  if (bill.locked) h += `<div class="notice"><span>🔒</span><div><b>DIKUNCI</b>Teman tidak bisa mengubah pilihan atau bergabung.</div></div>`;

  h += `<div class="tabs">${[["rekap", "PARTY"], ["items", "ITEM"], ["set", "SETELAN"]].map(([k, l]) => `<button class="sm ${tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>`;

  if (tab === "rekap") {
    h += `<div class="card"><span class="label">PARTY (${bill.members.length})</span><div class="row between" style="margin-top:4px"><span class="small muted">Status diubah langsung dari sini.</span><button class="sm soft" id="cpRecap">SALIN REKAP</button></div>`;
    if (!bill.members.length) h += `<p class="muted">Belum ada yang gabung. Bagikan link di atas.</p>`;
    for (const m of bill.members) {
      const br = personBreakdown(bill, m.id);
      h += `<div class="player">
        <div class="row between"><span class="av bob" style="animation-delay:${(m.name.length % 5) * .2}s">${av(m.avatar)}</span><div class="grow"><div class="strong" style="font-size:18px">${esc(m.name)}</div><div class="small muted">+${esc(m.phone || "")} · ${br.lines.length} item</div></div>
        <div style="text-align:right"><div class="px num" style="font-size:11px">${rp(m.owe)}</div></div></div>
        <div class="small muted" style="margin-top:4px">${br.lines.map(l => esc(l.name) + (l.n > 1 ? " ÷" + l.n : "")).join(", ") || "Belum memilih item"}</div>
        <div class="row between" style="margin-top:8px">${statusSel(m)}
          <div class="act">${!m.is_payer && m.owe > 0 && m.status !== "lunas" ? `<a class="btn wa sm" target="_blank" href="https://wa.me/${m.phone}?text=${encodeURIComponent(waText(m))}">TAGIH WA</a>` : ""}
          <button class="sm ghost" data-more="${m.id}">•••</button></div></div>
        <div class="act hide" id="more-${m.id}" style="margin-top:8px">
          <button class="sm ghost" data-reset="${m.id}">RESET PIN</button>
          <button class="sm danger" data-rm="${m.id}">KELUARKAN</button></div></div>`;
    }
    h += `</div>`;
  }

  if (tab === "items") {
    h += `<div class="card"><span class="label">ITEM (${bill.items.length})</span><div class="small muted" style="margin-top:4px">Subtotal ${rp(bill.subtotal)}</div>`;
    for (const it of bill.items) {
      h += `<div class="row between" style="border-top:2px dashed var(--line);padding:10px 0" id="it-${it.id}">
        <div class="grow"><div class="strong">${esc(it.name)}</div>
        <div class="small ${it.claimers.length ? "muted" : "err"}">${it.claimers.length ? it.claimers.map(c => esc(c.name)).join(", ") : "Belum diklaim"}</div></div>
        <div style="text-align:right"><div class="num">${rp(it.price)}</div>
        <div class="act" style="margin-top:4px"><button class="sm ghost" data-edit="${it.id}">UBAH</button><button class="sm danger" data-del="${it.id}">HAPUS</button></div></div></div>`;
    }
    h += `<div class="row ed" style="margin-top:12px;gap:6px"><input id="nName" placeholder="Nama item" class="grow"><span class="money sm" style="width:120px;flex:none"><input id="nPrice" placeholder="Harga" inputmode="numeric"></span><button class="sm" id="add">+ TAMBAH</button></div>
      <p class="small muted" style="margin-bottom:0">Kalau subtotal berubah, pajak tetap dihitung dari total akhir struk di tab Pengaturan.</p></div>`;
  }

  if (tab === "set") {
    h += `<div class="card"><span class="label">INFO TAGIHAN</span>
      <label>JUDUL</label><input id="sTitle" value="${esc(bill.title)}">
      <div class="row"><div class="grow"><label>TEMPAT</label><input id="sPlace" value="${esc(bill.place || "")}"></div>
      <div class="grow"><label>TANGGAL</label><input id="sDate" type="date" value="${esc(bill.bill_date || "")}"></div></div>
      <label>TOTAL AKHIR STRUK</label><div class="money"><input id="sTotal" inputmode="numeric" value="${fmtNum(Math.round(bill.total))}"></div>
      <label>NAMA PENALANG</label><input id="sPn" value="${esc(bill.payer_name || "")}">
      <label>HP PENALANG</label><input id="sPp" inputmode="tel" value="${esc(bill.payer_phone || "")}">
      <label>INFO TRANSFER</label><textarea id="sPi" style="min-height:80px;font-family:inherit">${esc(bill.payment_info || "")}</textarea>
      <button class="block" id="saveSet" style="margin-top:16px">SIMPAN</button></div>
      <div class="card"><span class="label">KUNCI TAGIHAN</span><p class="small muted" style="margin-top:8px">Kunci setelah semua pilihan beres. Teman tetap bisa melihat dan konfirmasi transfer.</p>
      <button class="block ${bill.locked ? "soft" : "gold"}" id="lock">${bill.locked ? "🔓 BUKA KUNCI" : "🔒 KUNCI TAGIHAN"}</button></div>`;
  }
  h += `<div class="card"><span class="label">HAPUS TAGIHAN</span><p class="small muted" style="margin-top:8px">Menghapus tagihan ini beserta semua pilihan teman. Tidak bisa dibatalkan. Hanya host tagihan ini dan admin yang bisa menghapus.</p>
    <button class="block danger" id="delBill">🗑️ HAPUS TAGIHAN</button></div>`;
  h += `<p style="text-align:center;margin-top:20px"><a href="admin.html" class="px" style="color:var(--acc);font-size:9px">◀ DAFTAR TAGIHAN</a></p>`;
  app.innerHTML = h;
  window.scrollTo(0, y);
  bind();
}

async function act(fn, args, msg) {
  try { bill = await rpc(fn, { p_master: master, p_code: code, ...args }); lastJson = JSON.stringify(bill); renderBill(); if (msg) { toast(msg); SFX.coin(); } }
  catch (e) { toast(e.message, true); }
}

// tombol berbahaya: ketuk dua kali untuk konfirmasi (tanpa dialog browser)
function twoTap(btn, label, fn) {
  if (btn.dataset.armed) return fn();
  const old = btn.textContent; btn.dataset.armed = 1; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}

function bind() {
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; editing = false; renderBill(); });
  const cl = $("#cpLink"); if (cl) cl.onclick = () => copyText(billLink(bill.code));
  const cr = $("#cpRecap"); if (cr) cr.onclick = () => copyText(recapText());
  app.querySelectorAll("[data-st]").forEach(s => {
    s.onfocus = () => (editing = true);
    s.onchange = () => { editing = false; act("sb_admin_set_status", { p_person: s.dataset.st, p_status: s.value }, "Status diperbarui"); };
    s.onblur = () => (editing = false);
  });
  app.querySelectorAll("[data-more]").forEach(b => b.onclick = () => $("#more-" + b.dataset.more).classList.toggle("hide"));
  app.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => twoTap(b, "YAKIN?", async () => {
    try { await rpc("sb_admin_reset_pin", { p_master: master, p_person: b.dataset.reset }); toast("PIN direset. Teman bisa membuat PIN baru saat masuk."); }
    catch (e) { toast(e.message, true); }
  }));
  app.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => twoTap(b, "YAKIN?", () => act("sb_admin_remove_member", { p_person: b.dataset.rm }, "Peserta dikeluarkan")));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => twoTap(b, "YAKIN?", () => act("sb_admin_item", { p_action: "delete", p_item_id: b.dataset.del }, "Item dihapus")));
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const it = bill.items.find(i => i.id === b.dataset.edit); editing = true;
    const row = $("#it-" + it.id);
    row.innerHTML = `<div class="ed grow" style="background:var(--gold-soft);border:var(--b);border-radius:10px;padding:10px">
      <label style="margin-top:0">NAMA ITEM</label><input id="eN" value="${esc(it.name)}">
      <label>HARGA</label><div class="money"><input id="eP" inputmode="numeric" value="${fmtNum(Math.round(it.price))}"></div>
      <div class="row" style="gap:8px;margin-top:12px"><button class="grow" id="eS">SIMPAN</button><button class="ghost grow" id="eC">BATAL</button></div></div>`;
    $("#eN").focus();
    moneyInput($("#eP"));
    $("#eC").onclick = () => { editing = false; renderBill(); };
    $("#eS").onclick = () => { editing = false; act("sb_admin_item", { p_action: "update", p_item_id: it.id, p_name: $("#eN").value, p_price: parseInt($("#eP").value.replace(/\D/g, "")) }, "Item diperbarui"); };
  });
  ["#sTotal", "#nPrice"].forEach(s => { const el = $(s); if (el) moneyInput(el); });
  const add = $("#add"); if (add) add.onclick = () => {
    const n = $("#nName").value.trim(), p = parseInt($("#nPrice").value.replace(/\D/g, ""));
    if (!n || isNaN(p)) return toast("Isi nama dan harga", true);
    act("sb_admin_item", { p_action: "add", p_name: n, p_price: p }, "Item ditambahkan");
  };
  if (tab === "set" || tab === "items") app.querySelectorAll("input, textarea").forEach(i => { i.onfocus = () => (editing = true); });
  const ss = $("#saveSet"); if (ss) ss.onclick = () => { editing = false; act("sb_admin_update_bill", { p_patch: {
    title: $("#sTitle").value, place: $("#sPlace").value, bill_date: $("#sDate").value, total: parseInt($("#sTotal").value.replace(/\D/g, "")) || 0,
    payer_name: $("#sPn").value, payer_phone: $("#sPp").value, payment_info: $("#sPi").value } }, "Tersimpan"); };
  const lk = $("#lock"); if (lk) lk.onclick = () => act("sb_admin_update_bill", { p_patch: { locked: !bill.locked } }, bill.locked ? "Kunci dibuka" : "Tagihan dikunci");
  const db = $("#delBill"); if (db) db.onclick = () => twoTap(db, "KETUK LAGI UNTUK HAPUS", async () => {
    try { await rpc("sb_admin_delete_bill", { p_master: master, p_code: code }); location.href = "admin.html"; } catch (e) { toast(e.message, true); }
  });
}

start();
</script>
</body>
</html>
